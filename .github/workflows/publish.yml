name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@bluefission/reactor

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@^11.5.1

      - name: Verify release identity
        run: npm run verify:release -- "${{ github.event.release.tag_name }}"

      - name: Test package
        run: npm test

      - name: Check package entry point
        run: npm run check

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish public package
        run: npm publish --provenance --access public
        env:
          # Required for the first publication only. Trusted publishing uses OIDC first.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
